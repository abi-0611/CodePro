apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app: codepro-api
spec:
  selector:
    app: codepro-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: codepro-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: codepro-api
  template:
    metadata:
      labels:
        app: codepro-api
        tier: codepro
    spec:
      initContainers:
        - name: migrate
          image: codepro-api:local
          imagePullPolicy: Never
          command:
            - /bin/sh
            - -c
            - alembic upgrade head
          envFrom:
            - configMapRef:
                name: codepro-config
            - secretRef:
                name: codepro-secrets
      containers:
        - name: api
          image: codepro-api:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: codepro-config
            - secretRef:
                name: codepro-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi