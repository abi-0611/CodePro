  objectives:
    - name: slo_compliance
      direction: maximize
      weight: 0.6
    - name: cost
      direction: minimize
      weight: 0.4
  scalingBehavior:
    scaleUp:
      maxPercent: 100
      cooldownSeconds: 180
    scaleDown:
      maxPercent: 50
      cooldownSeconds: 300
  dryRun: false
---
