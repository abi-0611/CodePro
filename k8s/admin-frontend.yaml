apiVersion: v1
kind: Service
metadata:
  name: admin-frontend
  labels:
    app: codepro-admin-frontend
spec:
  selector:
    app: codepro-admin-frontend
  ports:
    - name: http
      port: 4322
      targetPort: 4322
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-frontend
  labels:
    app: codepro-admin-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: codepro-admin-frontend
  template:
    metadata:
      labels:
        app: codepro-admin-frontend
        tier: codepro
    spec:
      containers:
        - name: admin-frontend
          image: codepro-admin-frontend:local
          imagePullPolicy: Never
          ports:
            - containerPort: 4322
              name: http
          envFrom:
            - configMapRef:
                name: codepro-config
            - secretRef:
                name: codepro-secrets
          readinessProbe:
            httpGet:
              path: /admin/login
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /admin/login
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi