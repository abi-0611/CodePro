apiVersion: v1
kind: Service
metadata:
  name: main-site
  labels:
    app: codepro-main-site
spec:
  selector:
    app: codepro-main-site
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: main-site
  labels:
    app: codepro-main-site
spec:
  replicas: 1
  selector:
    matchLabels:
      app: codepro-main-site
  template:
    metadata:
      labels:
        app: codepro-main-site
        tier: codepro
    spec:
      containers:
        - name: main-site
          image: codepro-main-site:local
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: codepro-config
            - secretRef:
                name: codepro-secrets
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi